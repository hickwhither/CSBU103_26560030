<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minishop</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="navbar">
    <a href="#" class="navbar-brand">
      <img src="assets/logo.svg" alt="Mini Shop Logo" class="brand-logo">
      <span class="brand-text">Mini Shop</span>
    </a>

    <a href="#" class="cart-btn" aria-label="Giỏ hàng">
      <span class="cart-icon">🛒</span>
      <span class="cart-badge">0</span>
    </a>
  </header>

  <main class="container">
    <!-- Searcu, filter -->
    <div class="controls-bar">
      <input 
        type="text" 
        id="search-input" 
        class="search-input" 
        placeholder="Search products..."
      >
      
      <div class="category-filters" id="category-filters">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="electronics">Electronics</button>
        <button class="filter-btn" data-category="Decor">Decor</button>
        <button class="filter-btn" data-category="books">Books</button>
      </div>
    </div>

    <!-- Total money, Clear cart -->
    <div class="cart-summary-bar">
      <div class="total-text">
        Total: <strong id="cart-total">0 ₫</strong>
      </div>
      <button id="clear-cart-btn" class="clear-cart-btn">Clear cart</button>
    </div>

    <!-- Product grid -->
    <div class="product-grid" id="product-grid">
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>

</html>
