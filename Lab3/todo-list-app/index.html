<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todo-app">
    <h1>My Tasks</h1>
    <form id="todoForm">
      <input type="text" id="todoInput" placeholder="What needs to be done?" autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <p>Active: <span id="cnt-active"></span></p>
    <div id="filter">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>
    <ul id="todoList"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
