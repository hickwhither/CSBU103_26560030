<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic·Tac·Toe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body class="d-grid place-items-center min-vh-100">

  <main class="card p-5 w-100" style="max-width: 300px;">
    <!-- Title -->
    <h1 class="text-center mb-4">
      Tic Tac Toe
    </h1>

    <!-- Scoreboard -->
    <div class="row g-2 mb-3 text-center">
      <div class="col">
        <div id="score-x" class="p-2 border-2 border-danger">
          <div>Player <i class="fg-danger fa-solid fa-x"></i></div>
          <div class="fg fg-danger">0</div>
        </div>
      </div>
      <div class="col">
        <div id="score-draw" class="p-2 fg-warning border-2 border-warning">
          <div>Draws</div>
          <div class="fg fg-warning">0</div>
        </div>
      </div>
      <div  class="col">
        <div id="score-o" class="p-2 border-2 border-info">
          <div>Player <i id="turn-icon" class="fg-info fa-solid fa-o"></i></div>
          <div class="fg fg-info">0</div>
        </div>
      </div>
    </div>

    <!-- Status -->
    <p class="text-center small mb-3">
      Player <i class="fg-info fa-solid fa-o"></i>'s turn
    </p>

    <!-- Board -->
    <div id="board" class="grid text-center grid-cols-3 gap-1 mb-3"></div>

    <!-- Button -->
    <div class="text-center">
      <button type="button" class="btn btn-info rounded-pill">
        <i class="fa-solid fa-repeat"></i>
        New Round
      </button>
    </div>
  </main>

  <script src="https://kit.fontawesome.com/65691720e5.js"></script>
  <script src="index.js"></script>
</body>
</html>
